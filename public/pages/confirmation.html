<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--This link charges JQuery-->

        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>

        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"

        crossorigin="anonymous"></script>
    <!--This link charges conection with Supabase-->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"

        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="../js/services/dataService.js"></script>
    <link rel="stylesheet" href="../css/payment.css" />

    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="../css/confirmation.css">

    <!-- Component Loader for Header and Footer -->
    <script src="/js/utils/componentLoader.js" defer></script>
</head>

<body>
    <header></header>

    <br />

    <!-- Immersive Background -->
    <div class="movie-bg" id="movieBg"></div>
    <div class="movie-bg-overlay"></div>

    <main>
        <section id="loadingScreen">
            <h1>Generating Ticket...</h1>
            <div id="loadContainer">
                <div class="spinner-border" style="width: 70px; height: 70px;" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <img src="../asset/img/popcorn-svgrepo-com.svg" alt="popcorn" id="popcornLoad">
            </div>
        </section>

        <div class="selection-container">
            <div class="booking-header">
                <div class="breadcrumb-nav">
                    <a href="#" class="step">Movie</a>
                    <a href="#" class="step">Seats</a>
                    <a href="#" class="step">Payment</a>
                    <span class="step active">Ticket</span>
                </div>
            </div>

            <div class="row">
                <!-- Left Side: Message -->
                <div class="col-lg-6 mb-4 mb-lg-0">
                    <div class="glass-panel text-center d-flex flex-column justify-content-center align-items-center">
                        <h1 class="section-title">ENJOY THE SHOW!</h1>
                        <p class="success-message">
                            Your payment was successful and your tickets have been sent to your email.
                            <br><br>
                            You can also download your digital pass below.
                        </p>

                        <button class="opusCinemaButton" id="buttondownloadpdf">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor"
                                class="bi bi-download" viewBox="0 0 16 16">
                                <path
                                    d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5" />
                                <path
                                    d="M7.646 11.854a.5.5 0 0 0 .708 0l3-3a.5.5 0 0 0-.708-.708L8.5 10.293V1.5a.5.5 0 0 0-1 0v8.793L5.354 8.146a.5.5 0 1 0-.708.708z" />
                            </svg>
                            Download Ticket
                        </button>

                        <a href="../index.html" class="home-link">Return to Homepage</a>
                    </div>
                </div>

                <!-- Right Side: Ticket -->
                <div class="col-lg-6">
                    <div class="ticket-wrapper">
                        <!-- ID 'ticketpdf' is used by the PDF download function -->
                        <div class="ticket" id="ticketpdf">
                            <div id="imageposter-container">
                                <img src="../asset/img/Logo.svg" alt="Movie Poster" id="imageposter">
                            </div>

                            <div class="ticket-divider">
                                <div class="dashed-line"></div>
                            </div>

                            <div id="qr" class="mb-3"></div>
                            <div class="ticket-details details">
                                <strong id="movieTitle">Loading...</strong>
                                <p id="movieDate">--/--/--</p>
                                <p id="movieHour">--:--</p>
                                <p><strong>Auditorium:</strong> <span id="movieAuditorium">--</span></p>
                                <p><strong>Seats:</strong> <span id="movieSeats">--</span></p>

                                <small style="display:block; margin-top:10px; color:#aaa; font-size: 0.7rem;">SCAN AT
                                    ENTRANCE</small>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="main-footer"></footer>
    <script>
        function printTickerPdf() {
            const element = document.getElementById("ticketpdf");
            const opt = {
                margin: [20, 45],
                filename: "Opus-Ticket.pdf",
                image: { type: "jpeg", quality: 0.99 },
                html2canvas: {
                    scale: 2,
                    useCORS: true,
                    scrollY: 0,
                    windowHeight: 1500, // Ensure ample height for capture
                    onclone: function (clonedDoc) {
                        const ticket = clonedDoc.getElementById('ticketpdf');
                        // Remove shadow to prevent bounding box inflation/clipping
                        ticket.style.boxShadow = 'none';
                        ticket.style.border = '5px solid #000';
                        ticket.style.boxSizing = 'border-box';
                        // Ensure background is solid
                        ticket.style.background = '#ffffff';

                        // Fix QR positioning for capture if needed
                        const qr = clonedDoc.getElementById('qr');
                        if (qr) {
                            // Simplify transform for canvas
                            qr.style.transform = 'translateX(-50%)';
                        }
                    }
                },
                jsPDF: { unit: "mm", format: "a4", orientation: "portrait" },
            };

            html2pdf().set(opt).from(element).save();
        }

        document.getElementById("buttondownloadpdf").addEventListener("click", function () {
            printTickerPdf();
        });
    </script>

    <script type="module">
        import { getPaymentConfirmation } from "../js/services/dataService.js";
        import { makeQrCode } from "../js/makeQrCode.js";

        // Helper to convert image URL to Base64 using local proxy
        async function toDataURL(url) {
            try {
                // Use our new Netlify function proxy
                const proxyUrl = `/.netlify/functions/imgProxy?url=${encodeURIComponent(url)}`;

                const response = await fetch(proxyUrl);
                if (!response.ok) throw new Error('Network response was not ok');

                const blob = await response.blob();
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onloadend = () => resolve(reader.result);
                    reader.onerror = reject;
                    reader.readAsDataURL(blob);
                });
            } catch (error) {
                console.error("Error converting image to base64 via proxy:", error);
                return null;
            }
        }

        async function initConfirmation() {
            const urlParams = new URLSearchParams(window.location.search);
            const salesId = urlParams.get("salesId");

            if (!salesId) {
                console.error("Sales ID not found");
                window.location.href = "/";
                return;
            }

            try {
                const bookingInfo = await getPaymentConfirmation(salesId);
                console.log("Confirmation Data:", bookingInfo);

                // Populate Text
                document.getElementById("movieTitle").innerText = bookingInfo.movie.title;
                document.getElementById("movieDate").innerText = bookingInfo.date;
                document.getElementById("movieHour").innerText = bookingInfo.hour;
                document.getElementById("movieAuditorium").innerText = bookingInfo.auditorium;
                document.getElementById("movieSeats").innerText = bookingInfo.seatsReserved.join(', ');

                // Handle Poster/Background
                const imageElement = document.getElementById("imageposter");
                const bgElement = document.getElementById("movieBg");

                if (bookingInfo.movie.poster) {
                    // Try to fetch and convert to Base64 using proxy for PDF compatibility
                    const base64Poster = await toDataURL(bookingInfo.movie.poster);

                    if (base64Poster) {
                        imageElement.src = base64Poster;
                        bgElement.style.backgroundImage = `url("${bookingInfo.movie.poster}")`;
                    } else {
                        // Fallback
                        imageElement.src = bookingInfo.movie.poster;
                        bgElement.style.backgroundImage = `url("${bookingInfo.movie.poster}")`;
                    }
                } else {
                    imageElement.src = "../asset/img/Logo.svg";
                }

                // Generate QR
                const movieInformation = {
                    salesId: salesId,
                    date: bookingInfo.date,
                    time: bookingInfo.hour,
                    movieTitle: bookingInfo.movie.title,
                    auditorium: bookingInfo.auditorium,
                    seats: bookingInfo.seatsReserved,
                };

                const canvas = document.createElement("canvas");
                // makeQrCode expects (element, text/object)
                makeQrCode(canvas, movieInformation);

                const qrContainer = document.getElementById("qr");
                qrContainer.innerHTML = ''; // Clear previous if any
                qrContainer.appendChild(canvas);

                $('#loadingScreen').fadeOut('slow');

            } catch (error) {
                console.error("Error loading confirmation:", error);
                $('#loadingScreen').fadeOut('fast');
            }
        }

        $(document).ready(initConfirmation);
    </script>
</body>

</html>
