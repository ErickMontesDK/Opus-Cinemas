<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Gugi&family=Orbitron:wght@400..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <title>Opus Cinemas</title>
    <!--This link charges JQuery-->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <!--This link charges Bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <!--This link charges conection with Supabase-->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="../css/moviepageinfo.css">

    <!-- Component Loader for Header and Footer -->
    <script src="/js/componentLoader.js" defer></script>
</head>

<body>
    <header></header>


    <main>
        <!-- Background Blur Container -->
        <div id="movieBackground" class="movie-bg"></div>
        <div class="movie-bg-overlay"></div>

        <section id="loadingScreen">
            <div id="loadContainer">
                <div class="spinner-border" style="width: 70px; height: 70px;" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <img src="../asset/img/popcorn-svgrepo-com.svg" alt="popcorn" id="popcornLoad">
            </div>
            <h1>Preparing your experience...</h1>
        </section>

        <div class="movie-info-container">
            <div class="movie-content-grid">
                <!-- Left Column: Poster & Details -->
                <div class="movie-main-card glass-panel">
                    <div class="movie-header-dynamic">
                        <div id="poster" class="floating-poster"></div>
                        <div class="movie-essentials">
                            <h1 id="title" class="cinematic-title"></h1>
                            <div class="movie-meta-tags">
                                <span id="genre" class="meta-tag"></span>
                                <span id="duration" class="meta-tag"></span>
                                <span id="rating" class="meta-tag"></span>
                            </div>
                            <div id="trailer" class="trailer-preview"></div>
                        </div>
                    </div>

                    <div class="movie-description-box">
                        <h3>Synopsis</h3>
                        <p id="synopsis"></p>
                        <div class="extra-credits">
                            <p id="director"></p>
                            <p id="advisory"></p>
                        </div>
                    </div>
                </div>

                <!-- Right Column: Schedules -->
                <div class="schedules-card glass-panel">
                    <h2 class="section-title">Showtimes</h2>
                    <div class="date-selector">
                        <button class="date-btn active" onclick="toggleSchedule('schedule1')">Today</button>
                        <button class="date-btn" onclick="toggleSchedule('schedule2')">Tomorrow</button>
                        <button class="date-btn" onclick="toggleSchedule('schedule3')">After Tomorrow</button>
                    </div>

                    <div class="schedules-content">
                        <div id="schedule1" class="schedule-pane active">
                            <div class="time-grid" id="today"></div>
                        </div>
                        <div id="schedule2" class="schedule-pane">
                            <div class="time-grid" id="tomorrow"></div>
                        </div>
                        <div id="schedule3" class="schedule-pane">
                            <div class="time-grid" id="afterTomorrow"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="main-footer"></footer>
    <script src="../js/movieinfo.js"></script>




    <script type="module">
        import { getMovieDetails } from "../js/services/dataService.js"

        $(document).ready(function () {
            const urlParams = new URLSearchParams(window.location.search)
            const movieId = urlParams.get('movieId')
            console.log(movieId)
            async function call_db_data(movieId) {
                const movies = await getMovieDetails(movieId);
                console.log(movies)

                insertMovieData(movies)
            }
            call_db_data(movieId)


        });
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"
        integrity="sha512-GsLlZN/3F2ErC5ifS5QtgpiJtWd43JWSuIgh7mbzZ8zBps+dvLusV+eNQATqgA/HdeKFVgA5v3S/cIrLF7QnIg=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    <script>
        var element = document.getElementById('element-to-print');
        html2pdf(element);
    </script>
</body>

</html>
