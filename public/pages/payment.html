<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Gugi&family=Orbitron:wght@400..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <title>Opus Cinemas | Payment</title>
    <!--This link charges JQuery-->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- EmailJS -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

    <script src="../js/services/dataService.js"></script>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/payment.css">
</head>

<body>
    <!-- Immersive Background -->
    <div class="movie-bg" id="movieBg"></div>
    <div class="movie-bg-overlay"></div>

    <header>
        <nav class="navbar">
            <div class="container-fluid" style="background-color: var(--black)">
                <div style="display: inline">
                    <a class="navbar-brand" href="/" id="header">
                        <img src="../asset/img/Logo.png" alt="Logo" width="30" height="24"
                            class="d-inline-block align-text-top" />
                        Opus-Cinemas
                    </a>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <!-- Cinematic Loading Screen -->
        <section id="loadingScreen">
            <h1 class="header-title" style="color: var(--yellow);">PREPARING YOUR CHECKOUT...</h1>
            <div id="loadContainer">
                <div class="spinner-border" style="width: 70px; height: 70px;" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
            </div>
        </section>

        <div class="selection-container">
            <div class="booking-header">
                <div class="breadcrumb-nav">
                    <div class="step">1. Seats</div>
                    <div class="step active">2. Payment</div>
                    <div class="step disabled">3. Ticket</div>
                </div>
            </div>

            <div class="booking-grid row">
                <!-- Left Side: Payment Form -->
                <div class="col-lg-8">
                    <div class="glass-panel main-panel">
                        <h2 class="section-title">Payment Details</h2>

                        <form id="paymentForm">
                            <div class="row">
                                <div class="col-md-6">
                                    <label class="opusCinemaFormLabel">FULL NAME</label>
                                    <input type="text" class="opusCinemaForm" id="userName"
                                        placeholder="Enter your full name" required autocomplete="name">
                                </div>
                                <div class="col-md-6">
                                    <label class="opusCinemaFormLabel">EMAIL ADDRESS</label>
                                    <input type="email" class="opusCinemaForm" id="userEmail"
                                        placeholder="For your digital tickets" required autocomplete="email">
                                </div>
                            </div>

                            <div class="row mt-3">
                                <div class="col-12">
                                    <label class="opusCinemaFormLabel">CARD NUMBER</label>
                                    <input type="text" class="opusCinemaForm" id="cardNumber"
                                        placeholder="0000 0000 0000 0000" maxlength="19" required
                                        autocomplete="cc-number">
                                </div>
                            </div>

                            <div class="row mt-3">
                                <div class="col-6">
                                    <label class="opusCinemaFormLabel">EXPIRY DATE</label>
                                    <input type="text" class="opusCinemaForm" id="cardExpiry" placeholder="MM/YY"
                                        maxlength="5" required autocomplete="cc-exp">
                                </div>
                                <div class="col-6">
                                    <label class="opusCinemaFormLabel">CVV</label>
                                    <input type="password" class="opusCinemaForm" id="cardCvv" placeholder="***"
                                        maxlength="3" required autocomplete="cc-csc">
                                </div>
                            </div>

                            <div class="finish-container mt-5">
                                <button type="submit" class="opusCinemaButton" id="btnFinish">
                                    COMPLETE BOOKING
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Right Side: Booking Summary -->
                <div class="col-lg-4">
                    <div class="glass-panel summary-panel">
                        <h3 class="section-title" style="font-size: 1.5rem;">Booking Summary</h3>

                        <div class="opusCinemaTicketInfo">
                            <div class="detail-row">
                                <span class="detail-label">Movie</span>
                                <span class="detail-value" id="summaryMovie">Loading...</span>
                            </div>
                            <div class="detail-row">
                                <span class="detail-label">Date</span>
                                <span class="detail-value" id="summaryDate">--/--/--</span>
                            </div>
                            <div class="detail-row">
                                <span class="detail-label">Time</span>
                                <span class="detail-value" id="summaryTime">--:--</span>
                            </div>
                            <div class="detail-row">
                                <span class="detail-label">Auditorium</span>
                                <span class="detail-value" id="summaryAuditorium">Room --</span>
                            </div>
                            <div class="detail-row">
                                <span class="detail-label">Seats</span>
                                <span class="detail-value" id="summarySeats">---</span>
                            </div>

                            <div class="price-row">
                                <span class="total-label">TOTAL</span>
                                <span class="total-value" id="summaryPrice">$0.00</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script type="module">
        import { getPaymentBookingInfo, completeBooking } from "../js/services/dataService.js";

        (function () {
            emailjs.init({
                publicKey: "WCH6V6X-vA5X8_2hI", // PUBLIC KEY remains same
            });
        })();

        async function initPayment() {
            const urlParams = new URLSearchParams(window.location.search);
            const showtimeId = urlParams.get("showtimeId");
            const selectedSeats = urlParams.get("seats") ? urlParams.get("seats").split(",") : [];

            if (!showtimeId || selectedSeats.length === 0) {
                window.location.href = "/";
                return;
            }

            try {
                const bookingData = await getPaymentBookingInfo(showtimeId);
                console.log("Booking Data:", bookingData);

                // Populate UI
                document.getElementById("summaryMovie").innerText = bookingData.movieTitle;
                document.getElementById("summaryDate").innerText = bookingData.date;
                document.getElementById("summaryTime").innerText = bookingData.time;
                document.getElementById("summaryAuditorium").innerText = bookingData.auditorium;
                document.getElementById("summarySeats").innerText = selectedSeats.join(", ");

                const totalPrice = (selectedSeats.length * 15).toFixed(2);
                document.getElementById("summaryPrice").innerText = `$${totalPrice}`;

                // Set atmospheric background
                if (bookingData.poster) {
                    document.getElementById("movieBg").style.backgroundImage = `url('${bookingData.poster}')`;
                }

                $('#loadingScreen').fadeOut('slow');

                // Form submission logic
                document.getElementById("paymentForm").addEventListener("submit", async (e) => {
                    e.preventDefault();
                    const btn = document.getElementById("btnFinish");
                    btn.disabled = true;
                    btn.innerText = "PROCESSING...";

                    const userName = document.getElementById("userName").value;
                    const userEmail = document.getElementById("userEmail").value;

                    try {
                        const result = await completeBooking(showtimeId, selectedSeats, userEmail, userName);
                        console.log("Booking completed:", result);

                        if (result.success) {
                            // Send Email confirmation
                            const emailParams = {
                                user_name: userName,
                                user_email: userEmail,
                                movie_title: bookingData.movieTitle,
                                auditorium_name: bookingData.auditorium,
                                showtime_date: bookingData.date,
                                showtime_time: bookingData.time,
                                selected_seats: selectedSeats.join(", "),
                                total_price: `$${totalPrice}`,
                                booking_id: result.salesId
                            };

                            console.log("Sending email confirmation via EmailJS...");
                            emailjs.send("service_opus", "template_ticket_opus", emailParams)
                                .then(() => console.log("Email sent successfully!"))
                                .catch((error) => console.error("Email failed:", error));

                            window.location.href = `confirmation.html?salesId=${result.salesId}`;
                        }
                    } catch (error) {
                        console.error("Booking error:", error);
                        alert("There was an error processing your booking. Please try again.");
                        btn.disabled = false;
                        btn.innerText = "COMPLETE BOOKING";
                    }
                });

            } catch (error) {
                console.error("Error loading payment page:", error);
            }
        }

        $(document).ready(initPayment);
    </script>
</body>

</html>
