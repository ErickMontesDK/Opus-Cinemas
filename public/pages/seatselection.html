<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Gugi&family=Orbitron:wght@400..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <title>Opus Cinemas</title>
    <!--This link charges JQuery-->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <!--This link charges Bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Bootstrap JS + Popper.js (to use the carousel component) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" defer></script>
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <link rel="stylesheet" href="./../css//style.css">
    <link rel="stylesheet" href="./../css/seats.css">

    <!-- Component Loader for Header and Footer -->
    <script src="/js/componentLoader.js?v=1.1" defer></script>
</head>

<body>
    <header></header>
    <main class="booking-main">
        <!-- Background Blur Container -->
        <div id="movieBackground" class="movie-bg"></div>
        <div class="movie-bg-overlay"></div>

        <section id="loadingScreen">
            <div id="loadContainer">
                <div class="spinner-border" style="width: 70px; height: 70px;" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <img src="../asset/img/popcorn-svgrepo-com.svg" alt="popcorn" id="popcornLoad">
            </div>
            <h1>Preparing your seats...</h1>
        </section>

        <div class="selection-container">
            <div class="booking-grid">
                <!-- Left Side: Panoramic Auditorium -->
                <div class="auditorium-wrapper glass-panel">
                    <div class="booking-header">
                        <div class="breadcrumb-nav">
                            <a href="#" id="movieInfoPage" class="step">Movie</a>
                            <span class="step active">Seats</span>
                            <span class="step">Payment</span>
                        </div>
                    </div>

                    <div class="screen-container">
                        <div class="cinematic-screen shadow"></div>
                        <p class="screen-label">SCREEN</p>
                    </div>

                    <div class="pan-container">
                        <div id="seatsDraw" class="seat-grid">
                            <!-- Seats dynamically injected here -->
                        </div>
                    </div>

                    <div class="legend">
                        <div class="legend-item">
                            <div class="seat-sample available"></div>
                            <span>Available</span>
                        </div>
                        <div class="legend-item">
                            <div class="seat-sample selected"></div>
                            <span>Selected</span>
                        </div>
                        <div class="legend-item">
                            <div class="seat-sample occupied"></div>
                            <span>Occupied</span>
                        </div>
                    </div>
                </div>

                <!-- Right Side: Booking Summary -->
                <div class="summary-wrapper glass-panel">
                    <div class="summary-content">
                        <h2 id="movieTitle" class="cinematic-movie-title">Movie Title</h2>

                        <div class="selection-details">
                            <div class="detail-row">
                                <span class="label">Time</span>
                                <span id="showtimeDate" class="value">-</span>
                            </div>
                            <div class="detail-row">
                                <span class="label">Auditorium</span>
                                <span id="auditoriumName" class="value">-</span>
                            </div>
                        </div>

                        <div class="ticket-selector-box">
                            <p class="selector-title">Number of Tickets</p>
                            <div class="ticket-controls">
                                <button id="ticketSubtract" class="ctrl-btn" disabled>−</button>
                                <div class="ticket-display">
                                    <span id="numberTickets">1</span>
                                    <span class="sub">Tickets</span>
                                </div>
                                <button id="ticketAdd" class="ctrl-btn">+</button>
                            </div>
                        </div>

                        <div class="seat-selection-status">
                            <div id="remainingSeats" class="status-msg">
                                <p>Select <span class="seatsLeft highlight">1</span> more seat</p>
                            </div>
                            <div id="overSeats" class="status-msg warning">
                                <p>Deselect <span class="seatsLeft highlight">1</span> seat</p>
                            </div>
                            <div id="seatsSelected" class="selected-tokens">
                                <!-- Selected seat tokens -->
                            </div>
                        </div>

                        <div class="total-price-box">
                            <span class="label">Total Amount</span>
                            <span class="price">$<span id="totalPrice">0</span></span>
                        </div>

                        <button id="continuePayment" class="checkout-btn" disabled>
                            CONTINUE TO PAYMENT
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M5 12h14M12 5l7 7-7 7" />
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer class="main-footer"></footer>
    <script>
        const urlParams = new URLSearchParams(window.location.search)
        const showtimeId = urlParams.get('showtimeId');
    </script>
    <script src="../js/seatsSelection.js?v=1.1"></script>

    <script type="module">
        import { getBookedSeats, registerTickets } from "../js/services/dataService.js"

        async function sendBookingInformation(ticketsSelected) {
            try {
                const ticketToken = await registerTickets(ticketsSelected, showtimeId);
                window.location.href = `/pages/payment.html?ticketToken=${ticketToken}`;
            } catch (error) {
                console.error('Error sending tickets to db:', error);
                alert('Error processing your tickets. Please try again later');
            }
        }

        function updateScreenWithShowtimeData(showtimeData) {
            // Synchronize auditorium layout with booked seats
            showtimeData.bookedSeats.forEach(bookedSeat => {
                if (!bookedSeat.available) {
                    $(`#${bookedSeat.seat_number}`).addClass('unavailableSeat').prop('disabled', true);
                }
            })

            // Inject movie details
            $('#movieTitle').text(showtimeData.movieTitle);
            $('#showtimeDate').text(`${showtimeData.date} at ${showtimeData.hour.slice(0, -3)}`);
            $('#auditoriumName').text(showtimeData.auditorium);
            $('#movieInfoPage').attr('href', `/pages/movie-info.html?movieId=${showtimeData.movieId}`);

            // Set cinematic backgrounds
            $('#movieBackground').css('background-image', `url("${showtimeData.moviePoster}")`);
            document.body.style.backgroundImage = `url("${showtimeData.moviePoster}")`;

            // Smooth transition
            $('#loadingScreen').fadeOut(800);
        }



        async function loadingSeatSelectionScreen(showtimeId) {
            const showtimeData = await getBookedSeats(showtimeId);

            if (showtimeData) {

                document.dispatchEvent(new CustomEvent('updatedTicketsAvailabilty', {
                    detail: [showtimeData.totalSeats, showtimeData.bookedSeats]
                }))
                updateScreenWithShowtimeData(showtimeData);
            }

            document.addEventListener('seatsObjectReady', (event) => {
                const ticketsSelected = event.detail
                console.log(ticketsSelected);

                sendBookingInformation(ticketsSelected);
            })
        }

        loadingSeatSelectionScreen(showtimeId);
    </script>

</body>

</html>
